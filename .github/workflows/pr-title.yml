name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional:
    runs-on: ubuntu-latest
    name: Conventional Commits title
    timeout-minutes: 2

    steps:
      # The title is passed through env, not interpolated into the script, so
      # it can't inject shell.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: [^[:space:]].*[^.]$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=PR title::Use Conventional Commits, e.g. 'fix(date): reject invalid dates' (see CONTRIBUTING.md)."
            exit 1
          fi
          if (( ${#TITLE} > 100 )); then
            echo "::error title=PR title::Keep the title under 100 characters (72 or fewer is better)."
            exit 1
          fi
